[project]
name = "yoto-mcp"
version = "0.1.0"
description = "Local stdio MCP for Yoto Make Your Own playlists"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp>=2.2,<3", "httpx>=0.28,<1", "yt-dlp==2026.8.19"]

[project.scripts]
yoto-mcp = "yoto_mcp.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yoto_mcp"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
